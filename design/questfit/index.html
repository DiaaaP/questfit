<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuestFit — макеты и сценарии</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #090a0e; color: #f4f1eb; }
    * { box-sizing: border-box; }
    body { margin: 0 auto; padding: 56px 24px; max-width: 1200px; }
    header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin-bottom: 48px; }
    h1 { margin: 0 0 10px; font-size: clamp(3rem, 8vw, 5.5rem); line-height: .98; letter-spacing: -.07em; }
    h1 span, a:focus-visible, .number { color: #ff9c62; }
    h2 { margin: 38px 0 16px; letter-spacing: -.02em; }
    p { margin: 0; color: #a7acb8; line-height: 1.6; }
    .links, #flows { display: flex; flex-wrap: wrap; gap: 10px; }
    a { color: inherit; text-decoration: none; }
    .links a, #flows a { padding: 12px 16px; border-radius: 10px; border: 1px solid #303543; }
    .links a:first-child { background: #ff9c62; color: #131318; border-color: transparent; font-weight: 700; }
    #screens { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; }
    .screen { display: flex; flex-direction: column; min-height: 144px; background: #12141a; border: 1px solid #20242d; border-radius: 16px; padding: 16px; }
    .screen:hover, #flows a:hover, .links a:hover { border-color: #ff9c62; }
    .screen .number { font-size: 12px; font-weight: 700; margin-bottom: 12px; font-variant-numeric: tabular-nums; }
    .screen strong { margin-bottom: 6px; }
    .screen p { font-size: 13px; }
    .screen-links { display: flex; flex-wrap: wrap; gap: 16px; margin-top: auto; padding-top: 14px; color: #ffbe9d; font-size: 13px; }
    .screen-links a:hover { text-decoration: underline; }
  </style>
  <script defer src="prototype-data.js"></script>
</head>
<body>
  <header>
    <div>
      <h1>Quest<span>Fit</span></h1>
      <p>Реестр макетов и начало сценариев для защиты</p>
    </div>
    <div class="links">
      <a href="https://stitch.withgoogle.com/projects/2731409007179667316">Открыть Stitch</a>
      <a href="https://www.figma.com/design/Y2wWlN8Lfd1os3m5BvB790">Открыть Figma</a>
    </div>
  </header>
  <main>
    <h2>Сценарии</h2>
    <div id="flows"></div>
    <h2>Реестр экранов</h2>
    <div id="screens"></div>
  </main>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const design = window.questFitDesign;
      const url = id => 'screens/' + String(id).padStart(2, '0') + '.html';
      const figma = (mode, screen) => 'https://www.figma.com/' + mode + '/' + design.figmaFile + '?node-id=' + screen.figmaNode.replace(':', '-');
      for (const { start, title } of design.flows) {
        const link = document.createElement('a');
        link.href = figma('proto', design.screens.find(screen => screen.id === start));
        link.textContent = title;
        document.querySelector('#flows').append(link);
      }
      for (const screen of design.screens) {
        const { id, title, task } = screen;
        const card = document.createElement('article');
        card.className = 'screen';
        const code = document.createElement('span');
        code.className = 'number';
        code.textContent = String(id).padStart(2, '0');
        const name = document.createElement('strong');
        name.textContent = title;
        const description = document.createElement('p');
        description.textContent = task;
        const links = document.createElement('div');
        links.className = 'screen-links';
        for (const [label, href] of [['HTML из Stitch', url(id)], ['Фрейм в Figma', figma('design', screen)]]) {
          const link = document.createElement('a');
          link.textContent = label;
          link.href = href;
          link.setAttribute('aria-label', label + ' — ' + title);
          links.append(link);
        }
        card.append(code, name, description, links);
        document.querySelector('#screens').append(card);
      }
    });
  </script>
</body>
</html>
